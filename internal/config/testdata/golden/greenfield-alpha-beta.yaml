# Cognitive Driven Development (CDD) Configuration — schema v1
#
# Generated by `cdd init`. It defines how Intrinsic Complexity Points (ICPs)
# are calculated, which limit a code unit must respect, and how violations are
# enforced and reported.
#
# Key naming: `icp-limits` and `outputFile` are kept verbatim from the adopted
# format; every other key is snake_case.
version: 1

# -----------------------------------------------------------------------------
# PROJECT TYPE
# -----------------------------------------------------------------------------
# greenfield | legacy  (docs/cdd.md §4A)
#   greenfield - strict from day one; limit band 7-14 (default 10)
#   legacy     - measure what exists, enforce on new code; band 20-40 (default 25)
# Drives the default limit and the band used for validation warnings.
project_type: greenfield

# -----------------------------------------------------------------------------
# METRICS: ICP WEIGHTS
# -----------------------------------------------------------------------------
# Structure: metrics -> [language] -> [file_regex_pattern] -> [metric_id]: [weight]
#
# Languages (canonical ids): go · java · kotlin · typescript
# A metric that is absent is disabled; weights must be > 0 (never write 0.0).
# Every language needs a ".*" entry with at least 3 metrics (docs/cdd.md §2).
#
# Metric vocabulary (default weight · languages):
#   code_branch        1.0  all         if/else, switch/when, ternary, loops (?. kotlin/ts)
#   condition          1.0  all         logical operators (&&, ||, ?? ts, ?: kotlin) in branch expressions
#   exception_handling 1.0  not go      try / catch / finally blocks
#   internal_coupling  1.0  all         references to types inside this project
#   external_coupling  0.5  all         framework / third-party types
#   stdlib_coupling    0.5  all         standard library types (optional, off by default)
#   inheritance        1.0  all         extends / implements, per level
#   local_variable     0.5  all         locals and fields (optional, off by default)
#   lambda             1.0  all         lambdas, method refs, func literals (optional, off by default)
#
# Pattern semantics: keys are Go RE2 regexes matched against the file path
# relative to this file, with `/` separators. When several patterns match, the
# last one in document order wins and its weights are merged over the earlier
# ones, so keep ".*" first and put specific layers below it.
metrics:
  alpha:
    ".*":
      code_branch: 1.0        # if/else, switch case, ternary, loops
      condition: 1.0          # && and || clauses
      exception_handling: 1.0 # try / catch / finally blocks
      internal_coupling: 1.0  # references to project classes
      external_coupling: 0.5  # framework / JDK types
      inheritance: 1.0        # extends / implements, per level
    ".*/adapters/.*":
      internal_coupling: 0.5  # references to project classes
    ".*Dto\\.java":
      internal_coupling: 0.5  # references to project classes
      external_coupling: 0.25 # framework / JDK types
    # ".*/dto/.*":
    #   internal_coupling: 0.5  # merged over the ".*" weights above
  beta:
    ".*":
      code_branch: 1.0        # if/when, loops, safe calls (?.)
      condition: 1.0          # &&, || and ?: clauses
      exception_handling: 1.0 # try / catch / finally blocks
      internal_coupling: 1.0  # references to project packages
      external_coupling: 0.5  # framework / third-party types
      inheritance: 1.0        # : Base() / : Iface, per level
    ".*/adapters/.*":
      internal_coupling: 0.5  # references to project packages
    ".*Dto\\.kt":
      internal_coupling: 0.5  # references to project packages
      external_coupling: 0.25 # framework / third-party types

# -----------------------------------------------------------------------------
# ICP-LIMITS: UNIT THRESHOLDS
# -----------------------------------------------------------------------------
# Structure: icp-limits -> [language] -> [file_regex_pattern]: [limit]
#
# The unit measured is a top-level type declaration for java / kotlin /
# typescript, and for go a top-level type with its methods or a top-level
# function. The pattern selects the file; the limit then applies to each unit
# inside it.
#
# docs/cdd.md: greenfield 7-10 (up to 14) · legacy 20-40
#              adapters 7-10 · use cases 14-20 · DTOs up to 20 (§4B, §5.1)
# Limits are integers >= 1; a value outside the band of `project_type` is a
# warning, not an error. Same last-match-wins precedence as `metrics`.
icp-limits:
  alpha:
    ".*": 10
    ".*/adapters/.*": 8
    ".*Dto\\.java": 14
    # ".*/adapters/.*": 8
    # ".*Dto\\.java": 20
  beta:
    ".*": 10
    ".*/adapters/.*": 8
    ".*Dto\\.kt": 14

# -----------------------------------------------------------------------------
# ENFORCEMENT
# -----------------------------------------------------------------------------
# block_on_ci: violations fail the future `cdd check`.
# legacy_mode:
#   strict_all         - every unit must comply (required when greenfield)
#   strict_on_new_only - existing files measured only; new files must comply
#   boy_scout          - modified files must not raise their baseline ICP
#                        (needs the baseline store; not supported yet)
#   measure_only       - report only; forces block_on_ci: false
enforcement:
  block_on_ci: true
  legacy_mode: strict_all
  # target_limit: 8                   # optional goal for progressive tightening

# -----------------------------------------------------------------------------
# ANALYSIS
# -----------------------------------------------------------------------------
# timeout: Max wall-clock time for a full `cdd check` / `cdd report` run.
# Go duration syntax (30s, 5m, 1h). 0s = no limit. When exceeded the run stops,
# reports the files analysed so far and exits with an error.
timeout: 5m

# -----------------------------------------------------------------------------
# REPORTER SETTINGS
# -----------------------------------------------------------------------------
reporter:
  # format: The output style. Supported: console, json, xml, markdown
  format: console
  # outputFile: Optional path to save the report, relative to this file and
  # inside the project. null = stdout.
  outputFile: null

# -----------------------------------------------------------------------------
# INTERNAL COUPLING DETECTION
# -----------------------------------------------------------------------------
# Settings to define what is considered "internal" to your project.
#   auto_detect: discover internal prefixes from the sources
#                java/kotlin -> `package` declarations under the source roots
#                go          -> `module` line of go.mod
#                typescript  -> tsconfig.json paths/baseUrl (relative imports
#                               are always internal)
#   packages:    explicit prefixes, e.g. "com.acme.app" (java/kotlin),
#                "github.com/acme/billing" (go), "@app/" (typescript)
internal_coupling:
  auto_detect: true
  packages:
    - "com.acme.billing"

# -----------------------------------------------------------------------------
# FILE FILTERING
# -----------------------------------------------------------------------------
# Patterns follow glob: or regex: syntax. If no prefix is provided, glob: is
# assumed. `exclude` wins over `include`.
# include: If not empty, only files matching at least one pattern are analyzed.
include: []
# exclude: Files matching these patterns are skipped (tests, generated code).
# Defaults written by `cdd init`:
#   go         -> **/*_test.go · vendor/**
#   java/kotlin-> **/src/test/** · **/build/** · **/target/**
#   typescript -> **/*.test.ts · **/*.spec.ts · **/*.test.tsx · **/*.spec.tsx
#                 **/*.test.mts · **/*.spec.mts · **/*.test.cts · **/*.spec.cts
#                 **/*.d.ts · **/*.d.mts · **/*.d.cts · **/node_modules/** · **/dist/**
exclude:
  - "**/src/test/**"
  - "**/build/**"
  - "**/target/**"
